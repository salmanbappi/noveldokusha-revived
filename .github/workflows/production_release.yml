name: Production - Public Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  buildRelease:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-bump version
        id: bump
        run: python .github/build_scripts/auto_bump.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup APK signing
        run: |
          if [ -f "release.keystore" ]; then
            echo "storeFile=../release.keystore" > custom.properties
            echo "storePassword=noveldokusha" >> custom.properties
            echo "keyAlias=noveldokusha" >> custom.properties
            echo "keyPassword=noveldokusha" >> custom.properties
          else
            keytool -genkeypair -v -keystore app/storeFile.jsk -alias noveldokushaKey -keyalg RSA -keysize 2048 -validity 10000 -storepass noveldokusha -keypass noveldokusha -dname "CN=Noveldokusha, OU=App, O=Noveldokusha, L=App, S=App, C=US" -storetype PKCS12
            echo "storeFile=storeFile.jsk" > custom.properties
            echo "storePassword=noveldokusha" >> custom.properties
            echo "keyAlias=noveldokushaKey" >> custom.properties
            echo "keyPassword=noveldokusha" >> custom.properties
          fi

      - name: Build app
        run: ./gradlew assembleFullRelease assembleFossRelease --continue -PlocalPropertiesFilePath=custom.properties --parallel --stacktrace

      - name: Create apk env info entries, move APK
        run: python .github/build_scripts/extract_info.py

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:master

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            *.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NovelDokusha v${{ steps.bump.outputs.new_version }}
          tag_name: v${{ steps.bump.outputs.new_version }}
          files: |
            ${{ env.APK_FILE_PATH_full }}
            ${{ env.APK_FILE_PATH_foss }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}